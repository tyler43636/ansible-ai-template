[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-init"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1"]

[project.scripts]
ansible-init = "ansible_init.cli:main"
molecule-init = "ansible_init.molecule_init:main"
